<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#0d1117"/>

  <!-- Subtle grid lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
  </g>

  <!-- Left: Stylized Botanical Leaf + Subtle Neural Nodes -->
  <g transform="translate(130, 110)">
    <path d="M 100 20 C 170 20, 190 120, 190 190 C 120 190, 20 170, 20 100 C 20 50, 60 20, 100 20 Z" fill="#1b2820" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <path d="M 20 100 Q 100 120 190 190" stroke="#3a5345" stroke-width="2" fill="none"/>
    <path d="M 70 85 Q 100 70 120 55" stroke="#3a5345" stroke-width="1.5" fill="none"/>
    <path d="M 110 125 Q 140 120 165 105" stroke="#3a5345" stroke-width="1.5" fill="none"/>

    <g stroke="rgba(255,255,255,0.25)" stroke-width="1">
      <line x1="30" y1="40" x2="100" y2="80"/>
      <line x1="100" y1="80" x2="170" y2="60"/>
      <line x1="100" y1="80" x2="120" y2="150"/>
      <line x1="120" y1="150" x2="180" y2="170"/>
    </g>
    <circle cx="30" cy="40" r="5" fill="#e4e4e7"/>
    <circle cx="100" cy="80" r="6" fill="#34d399"/>
    <circle cx="170" cy="60" r="5" fill="#e4e4e7"/>
    <circle cx="120" cy="150" r="5" fill="#34d399"/>
    <circle cx="180" cy="170" r="5" fill="#e4e4e7"/>
  </g>

  <!-- Right: ML Model Dashboard Panel -->
  <g transform="translate(370, 85)">
    <rect x="0" y="0" width="340" height="280" rx="12" fill="#161b22" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

    <text x="24" y="36" fill="#f4f4f6" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Crop Recommendation &amp; Disease AI</text>
    <text x="24" y="54" fill="#8b92a0" font-family="system-ui, sans-serif" font-size="11">Agricultural Machine Learning Platform</text>

    <!-- Stat 1 -->
    <rect x="24" y="72" width="138" height="56" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
    <text x="34" y="90" fill="#8b92a0" font-family="system-ui, sans-serif" font-size="10">Random Forest</text>
    <text x="34" y="114" fill="#f4f4f6" font-family="system-ui, sans-serif" font-size="17" font-weight="700">96.0% Acc</text>

    <!-- Stat 2 -->
    <rect x="178" y="72" width="138" height="56" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
    <text x="188" y="90" fill="#8b92a0" font-family="system-ui, sans-serif" font-size="10">CNN Architecture</text>
    <text x="188" y="114" fill="#f4f4f6" font-family="system-ui, sans-serif" font-size="17" font-weight="700">88.7% Acc</text>

    <g transform="translate(24, 144)">
      <rect x="0" y="0" width="292" height="52" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)"/>
      <text x="14" y="22" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="11" font-weight="500">Predicted Optimal: Rice, Maize, Jute</text>
      <text x="14" y="40" fill="#8b92a0" font-family="system-ui, sans-serif" font-size="10">Soil Parameters: N-P-K Vector &amp; Temperature</text>
    </g>

    <text x="24" y="248" fill="#64748b" font-family="system-ui, sans-serif" font-size="10 font-mono">TensorFlow · Scikit-Learn · Streamlit · Python</text>
  </g>
</svg>
