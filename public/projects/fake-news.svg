<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#0d0e12"/>

  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
  </g>

  <!-- Left: Document Text Representation -->
  <g transform="translate(130, 100)">
    <rect x="0" y="0" width="180" height="235" rx="10" fill="#15171d" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <rect x="20" y="24" width="140" height="10" rx="3" fill="rgba(255,255,255,0.2)"/>
    
    <rect x="20" y="48" width="90" height="6" rx="2" fill="rgba(255,255,255,0.15)"/>
    <rect x="118" y="48" width="42" height="6" rx="2" fill="rgba(255,255,255,0.08)"/>
    <rect x="20" y="64" width="140" height="6" rx="2" fill="rgba(255,255,255,0.08)"/>
    <rect x="20" y="80" width="120" height="6" rx="2" fill="rgba(255,255,255,0.08)"/>

    <g transform="translate(25, 115)">
      <rect x="0" y="0" width="130" height="85" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
      <circle cx="65" cy="32" r="16" fill="#27272a" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <path d="M 59 32 L 63 36 L 71 27" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="65" y="65" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">NLP VERIFIED</text>
    </g>
  </g>

  <!-- Right: Model Metrics Panel -->
  <g transform="translate(360, 85)">
    <rect x="0" y="0" width="350" height="280" rx="12" fill="#15171d" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

    <text x="24" y="36" fill="#f4f4f6" font-family="system-ui, sans-serif" font-size="15" font-weight="700">NLP Misinformation Classifier</text>
    <text x="24" y="54" fill="#8b92a0" font-family="system-ui, sans-serif" font-size="11">TF-IDF Vectorization &amp; Text Mining</text>

    <!-- KPI Row -->
    <g transform="translate(24, 70)">
      <rect x="0" y="0" width="92" height="48" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
      <text x="12" y="18" fill="#8b92a0" font-family="system-ui, sans-serif" font-size="10">Accuracy</text>
      <text x="12" y="38" fill="#f4f4f6" font-family="system-ui, sans-serif" font-size="16" font-weight="700">95.0%</text>

      <rect x="102" y="0" width="92" height="48" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
      <text x="112" y="18" fill="#8b92a0" font-family="system-ui, sans-serif" font-size="10">F1-Score</text>
      <text x="112" y="38" fill="#f4f4f6" font-family="system-ui, sans-serif" font-size="16" font-weight="700">0.948</text>

      <rect x="204" y="0" width="98" height="48" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
      <text x="214" y="18" fill="#8b92a0" font-family="system-ui, sans-serif" font-size="10">Vocabulary</text>
      <text x="214" y="38" fill="#f4f4f6" font-family="system-ui, sans-serif" font-size="16" font-weight="700">5,000+</text>
    </g>

    <g transform="translate(24, 136)">
      <text x="0" y="0" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="11" font-weight="500">Distribution Matrix</text>
      <rect x="0" y="10" width="145" height="40" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
      <text x="14" y="26" fill="#8b92a0" font-family="system-ui, sans-serif" font-size="9">True Positive (Real)</text>
      <text x="14" y="42" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">96.2%</text>

      <rect x="155" y="10" width="147" height="40" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
      <text x="169" y="26" fill="#8b92a0" font-family="system-ui, sans-serif" font-size="9">True Negative (Fake)</text>
      <text x="169" y="42" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">94.1%</text>
    </g>

    <text x="24" y="250" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Scikit-Learn · PassiveAggressive · NLTK · Streamlit</text>
  </g>
</svg>
