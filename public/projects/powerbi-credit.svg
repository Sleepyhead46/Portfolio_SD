<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#0d0e12"/>

  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
  </g>

  <!-- Credit Card Graphic -->
  <g transform="translate(100, 125)">
    <rect x="0" y="0" width="220" height="135" rx="10" fill="#1b1e26" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    
    <!-- Chip -->
    <rect x="20" y="24" width="32" height="24" rx="3" fill="#3f3f46" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <path d="M 20 36 L 52 36 M 36 24 L 36 48" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

    <!-- Contactless symbol -->
    <path d="M 180 32 A 8 8 0 0 1 180 44 M 186 28 A 14 14 0 0 1 186 48" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" fill="none" stroke-linecap="round"/>

    <!-- Details -->
    <text x="20" y="86" fill="#e4e4e7" font-family="monospace" font-size="12" letter-spacing="2">•••• •••• •••• 4920</text>
    <text x="20" y="112" fill="#8b92a0" font-family="system-ui, sans-serif" font-size="9" font-weight="600">ANALYTICS REPORT</text>
    <text x="160" y="112" fill="#8b92a0" font-family="system-ui, sans-serif" font-size="9">12/28</text>
  </g>

  <!-- Power BI Analytics Panel -->
  <g transform="translate(360, 85)">
    <rect x="0" y="0" width="350" height="280" rx="12" fill="#15171d" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

    <text x="24" y="36" fill="#f4f4f6" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Credit Card Transaction BI</text>
    <text x="24" y="54" fill="#8b92a0" font-family="system-ui, sans-serif" font-size="11">Spending Patterns · Delinquency Risk · Customer KPIs</text>

    <!-- KPI Row -->
    <g transform="translate(24, 70)">
      <rect x="0" y="0" width="92" height="48" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
      <text x="10" y="18" fill="#8b92a0" font-family="system-ui, sans-serif" font-size="10">Volume</text>
      <text x="10" y="38" fill="#f4f4f6" font-family="system-ui, sans-serif" font-size="15" font-weight="700">$18.2M</text>

      <rect x="102" y="0" width="92" height="48" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
      <text x="112" y="18" fill="#8b92a0" font-family="system-ui, sans-serif" font-size="10">Delinquency</text>
      <text x="112" y="38" fill="#34d399" font-family="system-ui, sans-serif" font-size="15" font-weight="700">1.24%</text>

      <rect x="204" y="0" width="98" height="48" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
      <text x="214" y="18" fill="#8b92a0" font-family="system-ui, sans-serif" font-size="10">Transactions</text>
      <text x="214" y="38" fill="#f4f4f6" font-family="system-ui, sans-serif" font-size="15" font-weight="700">650K+</text>
    </g>

    <!-- Category Bars -->
    <g transform="translate(24, 136)">
      <text x="0" y="0" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="11" font-weight="500">Spend Distribution</text>
      
      <text x="0" y="20" fill="#8b92a0" font-family="system-ui, sans-serif" font-size="10">Bills &amp; Utilities</text>
      <rect x="90" y="12" width="160" height="8" rx="2" fill="#71717a"/>
      <text x="260" y="20" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10">34%</text>

      <text x="0" y="40" fill="#8b92a0" font-family="system-ui, sans-serif" font-size="10">Travel &amp; Flights</text>
      <rect x="90" y="32" width="120" height="8" rx="2" fill="#52525b"/>
      <text x="220" y="40" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10">26%</text>

      <text x="0" y="60" fill="#8b92a0" font-family="system-ui, sans-serif" font-size="10">Retail &amp; Food</text>
      <rect x="90" y="52" width="95" height="8" rx="2" fill="#3f3f46"/>
      <text x="195" y="60" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10">21%</text>
    </g>

    <rect x="24" y="235" width="302" height="30" rx="6" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.06)"/>
    <text x="36" y="254" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11">Clean DAX Modeling &amp; Customer Segmentation</text>
  </g>
</svg>
